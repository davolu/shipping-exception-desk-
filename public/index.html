<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shipping Exception Desk</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121820; --panel2: #0e141b; --border: #1f2a36;
    --text: #d7e0ea; --dim: #8294a6; --accent: #4da3ff; --green: #2ecc71;
    --red: #ff5d5d; --amber: #ffb224; --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; }
  header span { color: var(--dim); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--border); padding: 20px; background: var(--panel2); }
  main { padding: 20px 24px; overflow-y: auto; }
  label { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
  input, textarea { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; }
  textarea { resize: vertical; min-height: 70px; font-family: var(--mono); font-size: 12px; }
  .scenario { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: var(--panel); }
  .scenario:hover { border-color: var(--accent); }
  .scenario.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .scenario b { display: block; font-size: 13px; }
  .scenario small { color: var(--dim); display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; }
  #run { width: 100%; margin-top: 16px; background: var(--accent); color: #04121f; }
  #run:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.streaming { background: var(--accent); animation: pulse 1s infinite; }
  .dot.waiting { background: var(--amber); animation: pulse 1s infinite; }
  .dot.done { background: var(--green); }
  .dot.blocked { background: var(--red); }
  @keyframes pulse { 50% { opacity: .3; } }
  .event { margin-bottom: 14px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; margin-bottom: 6px; }
  .chip.handoff { background: #16324a; color: var(--accent); }
  .chip.user { background: #1d2b22; color: var(--green); }
  .chip.error { background: #3a1b1b; color: var(--red); }
  .chip.final { background: #1d2b22; color: var(--green); }
  .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; }
  .approval { border: 1px solid var(--amber); border-radius: 12px; padding: 16px; background: #1a1507; }
  .approval h3 { margin: 0 0 4px; color: var(--amber); font-size: 14px; }
  .approval pre { background: var(--panel2); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 10px 0; }
  .approval .actions { display: flex; gap: 10px; }
  .approve { background: var(--green); color: #04170c; }
  .reject { background: var(--red); color: #210606; }
  .muted { color: var(--dim); }
  pre.final { background: var(--panel); border: 1px solid var(--green); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>📦 Shipping Exception Desk</h1>
  <span>OpenAI Agents SDK · streaming · human-in-the-loop approvals</span>
</header>
<div class="layout">
  <aside>
    <label>Case id</label>
    <input id="caseId" value="c1" />
    <label>Scenario</label>
    <div id="scenarios"></div>
    <label>Or a custom message</label>
    <textarea id="custom" placeholder="My package (UPS 1Z...) never arrived..."></textarea>
    <button id="run">Run case</button>
    <div class="status"><div class="dot" id="dot"></div><span id="statusText">idle</span></div>
  </aside>
  <main id="timeline"></main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const timeline = $('timeline');
  let selected = null;

  function setStatus(kind, text) {
    $('dot').className = 'dot ' + kind;
    $('statusText').textContent = text;
    $('run').disabled = kind === 'streaming' || kind === 'waiting';
  }

  function block(html, cls = 'event') {
    const div = document.createElement('div');
    div.className = cls;
    div.innerHTML = html;
    timeline.appendChild(div);
    timeline.scrollTop = timeline.scrollHeight;
    return div;
  }

  async function loadScenarios() {
    const list = await (await fetch('/scenarios')).json();
    for (const sc of list) {
      const el = document.createElement('div');
      el.className = 'scenario';
      el.innerHTML = `<b>${sc.id}</b><small>${sc.message}</small>`;
      el.onclick = () => {
        document.querySelectorAll('.scenario').forEach((s) => s.classList.remove('active'));
        el.classList.add('active');
        selected = sc.id;
        $('custom').value = '';
      };
      $('scenarios').appendChild(el);
    }
  }

  /* Parse an SSE stream from a fetch() POST (EventSource only supports GET). */
  async function consume(resp) {
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', currentBubble = null, currentAgent = 'Triage';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message', data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('event: ')) event = line.slice(7);
          else if (line.startsWith('data: ')) data = line.slice(6);
        }
        handle(event, data ? JSON.parse(data) : null);
      }
    }

    function handle(event, data) {
      if (event === 'incident') {
        block(`<span class="chip handoff">intake ✓ validated incident</span><pre class="final" style="border-color: var(--border)">${JSON.stringify(data, null, 2)}</pre>`);
      } else if (event === 'blocked') {
        setStatus('blocked', 'blocked by guardrail');
        block(`<span class="chip error">🛑 blocked</span><div class="bubble" style="border-color: var(--red)">${data.reason}</div>`);
      } else if (event === 'text') {
        if (!currentBubble) {
          block(`<span class="chip handoff">${currentAgent}</span>`);
          currentBubble = block('', 'event bubble');
        }
        currentBubble.textContent += data;
        timeline.scrollTop = timeline.scrollHeight;
      } else if (event === 'handoff') {
        currentAgent = data; currentBubble = null;
        block(`<span class="chip handoff">handoff → ${data}</span>`);
      } else if (event === 'approval_required') {
        currentBubble = null;
        setStatus('waiting', 'awaiting human approval');
        const calls = data.map((i) => `<pre>${i.name ?? i.type}(${i.arguments ?? ''})</pre>`).join('');
        const card = block(
          `<h3>⏸ Human approval required</h3>
           <div class="muted">The agent wants to run a gated tool. The run is paused and its state saved to disk.</div>
           ${calls}
           <div class="actions"><button class="approve">Approve</button><button class="reject">Reject</button></div>`,
          'event approval',
        );
        card.querySelector('.approve').onclick = () => decide(true, card);
        card.querySelector('.reject').onclick = () => decide(false, card);
      } else if (event === 'final') {
        setStatus('done', 'completed');
        block(`<span class="chip final">final output</span><pre class="final">${
          typeof data === 'string' ? data : JSON.stringify(data, null, 2)
        }</pre>`);
      } else if (event === 'error') {
        setStatus('blocked', data.name || 'error');
        block(`<span class="chip error">${data.name}</span><div class="bubble">${data.message}</div>`);
      }
    }
  }

  async function decide(approve, card) {
    card.querySelectorAll('button').forEach((b) => (b.disabled = true));
    block(`<span class="chip user">operator ${approve ? 'approved ✓' : 'rejected ✗'}</span>`);
    setStatus('streaming', 'resuming run...');
    const resp = await fetch(`/cases/${$('caseId').value}/approvals`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ approve }),
    });
    await consume(resp);
    if ($('statusText').textContent === 'resuming run...') setStatus('done', 'completed');
  }

  $('run').onclick = async () => {
    const custom = $('custom').value.trim();
    if (!selected && !custom) return alert('Pick a scenario or write a message.');
    timeline.innerHTML = '';
    const body = custom ? { text: custom } : { scenario: selected };
    block(`<span class="chip user">case ${$('caseId').value} · ${custom ? 'custom message' : selected}</span>`);
    setStatus('streaming', 'running...');
    const resp = await fetch(`/cases/${$('caseId').value}/messages`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    await consume(resp);
    if ($('statusText').textContent === 'running...') setStatus('done', 'completed');
  };

  loadScenarios();
</script>
</body>
</html>
